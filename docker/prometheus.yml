global:
  # La API corre en el host Windows (OneDrive/antivirus puede añadir latencia),
  # así que damos margen: timeout 10s dentro de un intervalo de 15s.
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "mall-customers-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
